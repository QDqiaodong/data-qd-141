[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-141"
version = "0.1.0"
description = "Bounded minimum-edit token sequence alignment with replayable operations"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
sequence-align = "sequence_align.cli:main"
sequence-merge = "sequence_align.merge_cli:main"
cdc-materialize = "cdc_materializer.cli:main"
lake-compactor = "lake_compactor.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
